<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ExamMitra Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Inter", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(145deg, #0a0c1a 0%, #0e1225 40%, #0c1020 100%);
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: blobM linear infinite;
    }

    .b1 {
      width: 650px;
      height: 650px;
      top: -180px;
      left: -180px;
      background: rgba(251, 191, 36, 0.1);
      animation-duration: 42s;
    }

    .b2 {
      width: 550px;
      height: 550px;
      top: 35%;
      right: -180px;
      background: rgba(239, 68, 68, 0.08);
      animation-duration: 52s;
      animation-delay: -20s;
    }

    .b3 {
      width: 480px;
      height: 480px;
      bottom: -120px;
      left: 25%;
      background: rgba(56, 189, 248, 0.07);
      animation-duration: 46s;
      animation-delay: -30s;
    }

    @keyframes blobM {
      0% {
        transform: translate(0, 0) scale(1);
      }

      25% {
        transform: translate(40px, 30px) scale(1.05);
      }

      50% {
        transform: translate(-20px, 50px) scale(0.97);
      }

      75% {
        transform: translate(30px, -20px) scale(1.03);
      }

      100% {
        transform: translate(0, 0) scale(1);
      }
    }

    .wm {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      user-select: none;
    }

    .wm-icon {
      font-size: 180px;
      opacity: 0.07;
      line-height: 1;
      animation: wmf 8s ease-in-out infinite;
    }

    .wm-name {
      font-family: "Playfair Display", serif;
      font-size: 90px;
      font-weight: 700;
      letter-spacing: -3px;
      color: rgba(255, 255, 255, 0.07);
      animation: wmf 8s ease-in-out infinite;
      animation-delay: .4s;
    }

    .wm-sub {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.05);
      margin-top: 10px;
      animation: wmf 8s ease-in-out infinite;
      animation-delay: .8s;
    }

    @keyframes wmf {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-16px);
      }
    }

    .card-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 16px;
    }

    .acard {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 22px;
      padding: 40px 36px 34px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(251, 191, 36, 0.08);
    }

    .a-head {
      text-align: center;
      margin-bottom: 30px;
    }

    .a-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b, #ef4444);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 14px;
      box-shadow: 0 0 24px rgba(251, 191, 36, 0.45);
    }

    .a-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.25);
      border-radius: 999px;
      padding: 3px 12px;
      margin-bottom: 10px;
      font-size: 0.62rem;
      font-weight: 700;
      color: #fbbf24;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .a-title {
      font-family: "Playfair Display", serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 5px;
    }

    .a-sub {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.28);
    }

    .fg {
      position: relative;
      margin-bottom: 14px;
    }

    .fg input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 42px 12px 16px;
      color: #f1f5f9;
      font-family: "Inter", sans-serif;
      font-size: 0.84rem;
      outline: none;
      transition: all .2s;
    }

    .fg input:focus {
      border-color: rgba(251, 191, 36, 0.5);
      background: rgba(251, 191, 36, 0.06);
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.08);
    }

    .fg input::placeholder {
      color: rgba(255, 255, 255, 0.22);
    }

    .fg i.ic {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.28);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .fg .eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.28);
      font-size: 0.85rem;
      cursor: pointer;
    }

    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
      display: none;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      font-family: "Inter", sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.4);
      transition: all .22s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .login-btn:hover {
      box-shadow: 0 10px 28px rgba(245, 158, 11, 0.6);
      transform: translateY(-1px);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.25);
    }

    .back-link a {
      color: #fcd34d;
      font-weight: 600;
      text-decoration: none;
      transition: color .18s;
    }

    .back-link a:hover {
      color: #fbbf24;
    }

    .err-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.78rem;
      color: #fca5a5;
      margin-bottom: 14px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="bg">
    <div class="bg-grid"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="wm">
      <div class="wm-icon">🛡️</div>
      <div class="wm-name">Admin</div>
      <div class="wm-sub">ExamMitra Control Panel</div>
    </div>
  </div>

  <div class="card-wrap">
    <div class="acard">
      <div class="a-head">
        <div class="a-logo">🛡️</div>
        <div class="a-badge"><i class="bi bi-shield-lock-fill"></i> Admin Access Only</div>
        <div class="a-title">Admin Login</div>
        <div class="a-sub">ExamMitra Control Panel</div>
      </div>

      <div class="err-msg" id="errMsg"><i class="bi bi-exclamation-triangle-fill"></i> <span id="errTxt">Invalid
          credentials</span></div>

      <form onsubmit="adminLogin(event)">
        <div class="fg">
          <input type="email" id="aEmail" placeholder="Admin Email" required
            oninput="this.value=this.value.toLowerCase();">
          <i class="bi bi-envelope ic"></i>
        </div>
        <div class="fg">
          <input type="password" id="aPass" placeholder="Admin Password" required>
          <span class="eye" id="eyeBtn"><i class="bi bi-eye"></i></span>
        </div>
        <button class="login-btn" type="submit"><i class="bi bi-shield-check"></i> Sign In as Admin</button>
      </form>

      <div class="back-link">Back to <a href="login.html">User Login</a></div>
    </div>
  </div>

  <script>
    if (localStorage.getItem("adminLoggedIn") === "true") { window.location.href = "admin.html"; }

    async function adminLogin(e) {
      e.preventDefault();
      var email = document.getElementById("aEmail").value;
      var pass = document.getElementById("aPass").value;
      var err = document.getElementById("errMsg");
      err.style.display = "none";
      try {
        var res = await fetch("http://127.0.0.1:8000/admin/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: pass })
        });
        var data = await res.json();
        if (res.ok) {
          localStorage.setItem("adminLoggedIn", "true");
          localStorage.setItem("adminEmail", email);
          window.location.href = "admin.html";
        } else {
          document.getElementById("errTxt").textContent = data.detail || "Invalid admin credentials";
          err.style.display = "flex";
        }
      } catch (ex) {
        document.getElementById("errTxt").textContent = "Server connection error. Make sure backend is running.";
        err.style.display = "flex";
      }
    }

    document.getElementById("eyeBtn").addEventListener("click", function () {
      var inp = document.getElementById("aPass");
      if (inp.type === "password") { inp.type = "text"; this.innerHTML = '<i class="bi bi-eye-slash"></i>'; }
      else { inp.type = "password"; this.innerHTML = '<i class="bi bi-eye"></i>'; }
    });
  </script>
</body>

</html>
